name: Docker Build, Push, and Deploy

on:
  push:
    branches:
      - week02
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}

  deploy:
    name: Deploy to EC2 using SSM
    needs: docker
    if: github.ref == 'refs/heads/week02'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure AWS Learner Lab credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send deployment and wait for success
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
          AWS_PAGER: ""
        shell: bash
        run: |
          set -euo pipefail

          jq -n --arg image "$IMAGE" '{
            commands: [
              "set -eu",
              ("docker pull " + ($image | @sh)),
              "docker stop cs6620-app || true",
              "docker rm cs6620-app || true",
              ("docker run -d --name cs6620-app --restart unless-stopped -p 80:5000 " + ($image | @sh)),
              "docker ps --filter name=cs6620-app",
              "for attempt in $(seq 1 30); do if curl -fsS --max-time 5 http://localhost/health | grep -q Topic7-Ex3-v2; then exit 0; fi; sleep 2; done; docker logs --tail 50 cs6620-app; exit 1"
            ]
          }' > parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Topic7-Ex3 GitHub run $GITHUB_RUN_ID" \
            --parameters file://parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"
          echo "Deployment requested at: $(date -u +%FT%TZ)"

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>ssm-error.txt) || {
                if grep -q InvocationDoesNotExist ssm-error.txt; then
                  sleep 5
                  continue
                fi
                cat ssm-error.txt >&2
                exit 1
              }

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
                  --output json

                test "$STATUS" = Success
                exit
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM execution"
          exit 1
